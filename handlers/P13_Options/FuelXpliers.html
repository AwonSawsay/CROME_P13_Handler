<!--
*********************************************************************
P13 Main Fuel Base Page for CROME
Auth: Awon (BiggieSmallBlock on pgmfi)
*********************************************************************
This page allows the user to edit the 'Main Fuel Base' used in P13 like
ECUs. The 'Main Fuel base' is the single largest contributor to the 
final fuel value on these ROMs, and is edited on a row by row basis. 

The "Main" fuel tables are actually just trim values that make 
adjustments to this base. An 0x80 value in a fuel table will 
result in a "no-change" to the fuel base. Higher is higher, 
lower is lower.  

It's worth noting that when honda tuned these 
ECUs, the entire first column of the primary fuel tables is all 0x80.
Possibly meaning that when they tuned them, they started by getting the
fuel base curve correct and then added fuel with the trim table as the 
columns went up.  

Also worth noting that the ECU won't actually allow 
a value below 0x80 or higher than 0xB0 in the fuel table.
Actually all the values in the table are divided by 2 as soon 
as they are retrieved, so it actually replaces anything lower than 0x40 with
0x40(no change) and higher than 0x58 with 0x58. 
On the options page there is an option to 'Force larger fuel 
table range'. This option actually removes the TableValue/2 code and divides 
the entire FuelTables /2 in ROM, giving us a larger range for tuning.
At the same time the patch extends the max cell value from 0x58 to 0xff. 
This changes our previous table range from 
0xB0 - 0x80 = Stock 48 Possible fuel table values
0x58 - 0x40 = Stock 24 actual adjustments allowed
0xff - 0x40 = Patched 191 adjustment values allowed.

The 'Fuel Multiplier' in the options page is actually a direct adjustment to 
fuel base. It uses code that Honda built in allowing them to make the same 
adjustment using the RP jumpers while in "Debug mode".

Changelog:
    -v1.0   - Initial working release - March 2026
********************************************************************
-->

    <script language="javascript">
        //**********************************************************
        var crome = window.external;
        var rom = crome.rom;

        var LOW_CAM_XPLIER_TABLE = address.TBL_LOW_CAM_ROW_XPLIER_LOC;
        var HIGH_CAM_XPLIER_TABLE = address.TBL_HI_CAM_ROW_XPLIER_LOC;
        var tableAddress = LOW_CAM_XPLIER_TABLE;
        var rpmScalarAddress = rom.addressOf('LOW_REV_SCALAR');

        //Multiplier Conversion
        var showRaw = false;
        var divider = 16;

        //**********************************************************

        //Constrain value 
        function constrain(cValue, min, max) {
            if (cValue < min) cValue = min;
            if (cValue > max) cValue = max;
            return cValue;
        }

        //Display RPM value for each scalar row
        function updateRPMrows() {
            var rpmRows = document.getElementsByName('lblRow');
            for (var i = 0; i < rpmRows.length; i++) {
                rpmRows[i].innerHTML = Math.round(1875000 / rom.wordAt(rpmScalarAddress + (i * 2)));
            }
        }

        //Set variables for high or low cam
        function selectCam(cam) {
            if (cam == 0) {

                tableAddress = LOW_CAM_XPLIER_TABLE;
                rpmScalarAddress = rom.addressOf('LOW_REV_SCALAR')
            }

            if (cam == 1) {
                tableAddress = HIGH_CAM_XPLIER_TABLE;
                rpmScalarAddress = rom.addressOf('HIGH_REV_SCALAR');
            }

            loadAllData();
        }

        //Multiplier text for a byte in the current display mode
        function xplierByteToText(b) {
            divider = 16;
            if (document.getElementById('chkShowRaw').checked) divider = 1;

            //Return raw hex
            if (document.getElementById('chkShowHex').checked) return "0x" + parseInt(b).toString(16).toUpperCase();

            //Return dec Raw or Multiplier
            return Math.round((b / divider) * 100) / 100;
        }

        //Get multiplier Byte from ROM table, convert if required
        function byteToMapXplier(address) {
            return xplierByteToText(rom.byteAt(address));
        }

        //Save user multiplier input to ROM, convert if required. Returns null for text that is not a number
        function mapXplierToByte(value) {
            //Hex display: parseInt(..., 16) reads "0x75" and "75". parseFloat("0x75") is 0
            var hex = document.getElementById('chkShowHex').checked;
            value = hex ? parseInt(value, 16) : parseFloat(value);
            if (isNaN(value)) return null;
            divider = 16;
            if (document.getElementById('chkShowRaw').checked || hex) divider = 1;
            return constrain(Math.round(value * divider), 0 , 255);
        }

        //Addon text for a byte in the current display mode
        function addonByteToText(b) {

            //Return raw hex
            if (document.getElementById('chkShowHex').checked) return "0x" + parseInt(b).toString(16).toUpperCase();

            //Show raw decimal
            if (document.getElementById('chkShowRaw').checked) return b;

            //Show as raw fuel amount
            return (b - 128) * 2;
        }

        //Get addon byte from ROM table, convert if required
        function byteToAddon(address) {
            return addonByteToText(rom.byteAt(address));
        }

        //Save user addon value to ROM, convert if required. Returns null for text that is not a number
        function addonToByte(addonValue) {
            var hex = document.getElementById('chkShowHex').checked;
            addonValue = hex ? parseInt(addonValue, 16) : parseInt(addonValue, 10);
            if (isNaN(addonValue)) return null;

            //No conversion if hex or raw
            if (hex || document.getElementById('chkShowRaw').checked) return constrain(addonValue, 0, 255);
            return constrain(Math.round(addonValue / 2 + 128), 0, 255);
        }

        //Populate text boxes and update RPM display
        function loadAllData() {

            FuelXplierFrm.txtRowXplier1.value = byteToMapXplier(tableAddress + 0);
            FuelXplierFrm.txtRowXplier2.value = byteToMapXplier(tableAddress + 1);

            FuelXplierFrm.txtRowXplier6.value = byteToMapXplier(tableAddress + 5);
            FuelXplierFrm.txtRowXplier7.value = byteToMapXplier(tableAddress + 6);
            FuelXplierFrm.txtRowXplier8.value = byteToMapXplier(tableAddress + 7);

            FuelXplierFrm.txtRowAddon20.value = byteToAddon(tableAddress + 39);

            updateRPMrows();
        }

        //Only allowable characters in text boxes
        function keyHandler() {
            var key = window.event.keyCode;
            var keyOut = key;

            //Enter key Pressed, confirm save then save to ROM and refresh
            if (key == 13) {
                if (!confirm("Save to ROM?")) return;
                Apply();
                document.activeElement.blur();
                return;
            }

            //Exclude all keys except 0 through 9 '-' and '.' key press
            if ((key < 45) || (key > 57) || key == 47) keyOut = 0;

            //Filter for Hex characters 
            if (document.getElementById('chkShowHex').checked) {
                //allow A-F , a-f , and 'x' 
                if ((key > 64 && key < 71) || (key > 96 && key < 103) || key == 120) keyOut = key;
                //and exclude '-' and '.'
                if (key == 45 || key == 46) keyOut = 0;
            }

            window.event.keyCode = keyOut;
        }

        //Clamp a multiplier or addon box to its byte range when focus leaves it.
        //A value clamped to 0x00 or 0xFF shows the boundary; text that is not a number restores the ROM value
        function limitValue(id) {
            var name = String(id.name);
            var isXplier = name.indexOf('txtRowXplier') === 0;
            var row = parseInt(name.replace(/\D/g, ''), 10) - 1;
            var b = isXplier ? mapXplierToByte(id.value) : addonToByte(id.value);
            if (b === null) {
                id.value = isXplier ? byteToMapXplier(tableAddress + row) : byteToAddon(tableAddress + 20 + row);
                return;
            }
            if (b === 0 || b === 255) id.value = isXplier ? xplierByteToText(b) : addonByteToText(b);
        }

        // Apply chnges to rom..
        function Apply() {
            //Boxes are clamped when focus leaves them; clamp again in case Apply is reached without that
            for (var i = 1; i <= 20; i++) {
                limitValue(FuelXplierFrm['txtRowXplier' + i]);
                limitValue(FuelXplierFrm['txtRowAddon' + i]);
            }
            rom.gup();     // begin group undo
            rom.byteAt(tableAddress + 0) = mapXplierToByte(FuelXplierFrm.txtRowXplier1.value);
            rom.byteAt(tableAddress + 1) = mapXplierToByte(FuelXplierFrm.txtRowXplier2.value);
            rom.byteAt(tableAddress + 2) = mapXplierToByte(FuelXplierFrm.txtRowXplier3.value);
            rom.byteAt(tableAddress + 3) = mapXplierToByte(FuelXplierFrm.txtRowXplier4.value);
            rom.byteAt(tableAddress + 4) = mapXplierToByte(FuelXplierFrm.txtRowXplier5.value);
            rom.byteAt(tableAddress + 5) = mapXplierToByte(FuelXplierFrm.txtRowXplier6.value);
            rom.byteAt(tableAddress + 6) = mapXplierToByte(FuelXplierFrm.txtRowXplier7.value);
            rom.byteAt(tableAddress + 7) = mapXplierToByte(FuelXplierFrm.txtRowXplier8.value);
            rom.byteAt(tableAddress + 8) = mapXplierToByte(FuelXplierFrm.txtRowXplier9.value);
            rom.byteAt(tableAddress + 9) = mapXplierToByte(FuelXplierFrm.txtRowXplier10.value);
            rom.byteAt(tableAddress + 10) = mapXplierToByte(FuelXplierFrm.txtRowXplier11.value);
            rom.byteAt(tableAddress + 11) = mapXplierToByte(FuelXplierFrm.txtRowXplier12.value);
            rom.byteAt(tableAddress + 12) = mapXplierToByte(FuelXplierFrm.txtRowXplier13.value);
            rom.byteAt(tableAddress + 13) = mapXplierToByte(FuelXplierFrm.txtRowXplier14.value);
            rom.byteAt(tableAddress + 14) = mapXplierToByte(FuelXplierFrm.txtRowXplier15.value);
            rom.byteAt(tableAddress + 15) = mapXplierToByte(FuelXplierFrm.txtRowXplier16.value);
            rom.byteAt(tableAddress + 16) = mapXplierToByte(FuelXplierFrm.txtRowXplier17.value);
            rom.byteAt(tableAddress + 17) = mapXplierToByte(FuelXplierFrm.txtRowXplier18.value);
            rom.byteAt(tableAddress + 18) = mapXplierToByte(FuelXplierFrm.txtRowXplier19.value);
            rom.byteAt(tableAddress + 19) = mapXplierToByte(FuelXplierFrm.txtRowXplier20.value);

            rom.byteAt(tableAddress + 20) = addonToByte(FuelXplierFrm.txtRowAddon1.value);
            rom.byteAt(tableAddress + 21) = addonToByte(FuelXplierFrm.txtRowAddon2.value);
            rom.byteAt(tableAddress + 22) = addonToByte(FuelXplierFrm.txtRowAddon3.value);
            rom.byteAt(tableAddress + 23) = addonToByte(FuelXplierFrm.txtRowAddon4.value);
            rom.byteAt(tableAddress + 24) = addonToByte(FuelXplierFrm.txtRowAddon5.value);
            rom.byteAt(tableAddress + 25) = addonToByte(FuelXplierFrm.txtRowAddon6.value);
            rom.byteAt(tableAddress + 26) = addonToByte(FuelXplierFrm.txtRowAddon7.value);
            rom.byteAt(tableAddress + 27) = addonToByte(FuelXplierFrm.txtRowAddon8.value);
            rom.byteAt(tableAddress + 28) = addonToByte(FuelXplierFrm.txtRowAddon9.value);
            rom.byteAt(tableAddress + 29) = addonToByte(FuelXplierFrm.txtRowAddon10.value);
            rom.byteAt(tableAddress + 30) = addonToByte(FuelXplierFrm.txtRowAddon11.value);
            rom.byteAt(tableAddress + 31) = addonToByte(FuelXplierFrm.txtRowAddon12.value);
            rom.byteAt(tableAddress + 32) = addonToByte(FuelXplierFrm.txtRowAddon13.value);
            rom.byteAt(tableAddress + 33) = addonToByte(FuelXplierFrm.txtRowAddon14.value);
            rom.byteAt(tableAddress + 34) = addonToByte(FuelXplierFrm.txtRowAddon15.value);
            rom.byteAt(tableAddress + 35) = addonToByte(FuelXplierFrm.txtRowAddon16.value);
            rom.byteAt(tableAddress + 36) = addonToByte(FuelXplierFrm.txtRowAddon17.value);
            rom.byteAt(tableAddress + 37) = addonToByte(FuelXplierFrm.txtRowAddon18.value);
            rom.byteAt(tableAddress + 38) = addonToByte(FuelXplierFrm.txtRowAddon19.value);
            rom.byteAt(tableAddress + 39) = addonToByte(FuelXplierFrm.txtRowAddon20.value);
            rom.gup();     // end group undo
            //window.close();
            crome.refresh();
            loadAllData();
        }

    </script>
</head>
