<script language="javascript">
<!--
//**********************************************************
// Start-Up Idle Map II: 7 rows of [ECT byte][RPM word], 3 bytes per row.
// Reading and writing use the same addresses.
var IDLE_ECT_BASE = 0x5532;     // Row 1 ECT byte
var IDLE_RPM_BASE = 0x5533;     // Row 1 RPM word
var IDLE_STEP = 3;
var IDLE_ROWS = 7;
var ECT_MIN = -20;              // Whole degrees shown for byte 0xFF (-20.25 C)
var ECT_MAX = 120;              // Byte 0x00
var RPM_MIN = 29;               // Lowest RPM a word holds: 1875000 / 0xFFFF = 28.6
var loadedText = {};            // Text shown at load. Apply writes only boxes the user changed

function loadDefaults () {
  for (var i = 0; i < IDLE_ROWS; i++) {
    var deg = IDLEfrm['txtDeg' + (i + 1)];
    var rpm = IDLEfrm['txtIdleRPM' + (i + 1)];
    deg.value = _byte_to_ect(window.external.rom.byteAt(IDLE_ECT_BASE + i * IDLE_STEP));
    rpm.value = _word_to_rpm(window.external.rom.wordAt(IDLE_RPM_BASE + i * IDLE_STEP));
    loadedText[deg.name] = String(deg.value);
    loadedText[rpm.name] = String(rpm.value);
  }
}
//**********************************************************
//RPMfrm.txtTest.onKeyPress = keyHandler;
//
// Digits only
function keyHandler () {
var
  key = window.event.keyCode;
  if ((key < 48) || (key > 57)) window.event.keyCode = 0;
}
// Digits and a minus sign, for temperatures
function tempKeyHandler () {
  var key = window.event.keyCode;
  if (key == 45) return;
  if ((key < 48) || (key > 57)) window.event.keyCode = 0;
}
//**********************************************************
// Clamp boxes to what the ROM can store when focus leaves them.
// Blank or invalid text restores the loaded value.
function clampEctField(field) {
  var deg = parseFloat(field.value);
  if (isNaN(deg)) { field.value = loadedText[field.name]; return; }
  if (deg < ECT_MIN) field.value = ECT_MIN;
  if (deg > ECT_MAX) field.value = ECT_MAX;
}
function clampRpmField(field) {
  var rpm = parseFloat(field.value);
  if (isNaN(rpm)) { field.value = loadedText[field.name]; return; }
  if (rpm < RPM_MIN) field.value = RPM_MIN;
}
function fieldChanged(field) {
  return String(field.value) != loadedText[field.name];
}
//**********************************************************
// Apply chnges to rom..
//
function Apply() {
  var i, deg, rpm;
  for (i = 0; i < IDLE_ROWS; i++) {
    clampEctField(IDLEfrm['txtDeg' + (i + 1)]);
    clampRpmField(IDLEfrm['txtIdleRPM' + (i + 1)]);
  }
  window.external.rom.gup();     // begin group undo
  for (i = 0; i < IDLE_ROWS; i++) {
    deg = IDLEfrm['txtDeg' + (i + 1)];
    rpm = IDLEfrm['txtIdleRPM' + (i + 1)];
    if (fieldChanged(deg)) window.external.rom.byteAt(IDLE_ECT_BASE + i * IDLE_STEP) = _ect_to_byte(deg.value);
    if (fieldChanged(rpm)) window.external.rom.wordAt(IDLE_RPM_BASE + i * IDLE_STEP) = _rpm_to_word(rpm.value);
  }
  window.external.rom.gup();     // end group undo
  window.close();
}
//**********************************************************
// Conversion formulas!!
//**********************************************************
// Convert Temp
function _byte_to_ect(b) {
	return Math.round(120 - (0.55*b));
}
function _ect_to_byte(v) {
	return Math.round((120 /0.55) - (v / 0.55));
}
//************
// Convert RPM
function _word_to_rpm(w) {
  return Math.round(1875000 / w);
}
function _rpm_to_word(r) {
  return Math.round(1875000 / r);
}
//**********************************************************
//-->
</script>
</head>
<body scroll="no" onLoad="loadDefaults()">
<form action="" method="post" name="IDLEfrm" id="IDLEfrm">
<table width="100%" border="0">

  </td>
  <td align="middle">
      <input name="txtIdleRPM1" type="text" class="formObjects" id="txtIdleRPM1" size="5" maxlength="4" value="" onKeyPress="keyHandler()" onchange="clampRpmField(this)">
